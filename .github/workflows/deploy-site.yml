# Deploys ostify.co.uk to App Service in UK South, so the website is hosted
# in the UK like the rest of Ostify (see privacy/index.html). The enquiry
# function has its own workflow; its folder is left out of the site.

name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      - "azure-function/**"
      - ".github/workflows/main_ostify-email.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_SERVICE_NAME: page-ostify-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build roles and content pages
        # roles/*.md become /careers/ pages; tools/content.json becomes guides and news; tools/learn.html becomes /learn/.
        run: |
          pip install --quiet markdown
          python3 tools/build_content.py
          python3 tools/build_roles.py
          python3 tools/build_learn.py

      - name: Collect site files
        # The pages go in public/; server.js sits beside them and serves them.
        run: |
          mkdir -p site/public
          rsync -a ./ site/public/ \
            --exclude site --exclude .git --exclude .github --exclude .gitignore \
            --exclude azure-function --exclude tools --exclude roles --exclude INTEGRATIONS.md \
            --exclude server.js --exclude .DS_Store
          cp server.js site/

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_58B12E391F084290A987719D1D6E6BD8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_149C761DD46045FDB52146B8D3451054 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5209ACDDC1EE4FC08D69A02548064D0E }}

      - name: Deploy static files to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          package: ./site
